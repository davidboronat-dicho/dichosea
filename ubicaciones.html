<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicho · Ubicaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root {
  --green-deep: #14532D;
  --green:      #16A34A;
  --green-mid:  #15803d;
  --green-l:    #F0FDF4;
  --green-b:    #D1FAE5;
  --surface:    #F5F1E8;
  --card:       #FFFFFF;
  --border:     #D8D2C3;
  --border-l:   #E8E4DA;
  --text:       #1C2B20;
  --muted:      #6B7A6E;
  --muted-l:    #9AAA9E;
  font-family: 'Jost', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-y: scroll; }
body { background: var(--surface); color: var(--text); min-height: 100vh; font-size: 14px; zoom: 1.25; }

/* ── HEADER ── */
.header {
  background: var(--green-deep); height: 54px;
  display: flex; align-items: stretch; padding: 0 28px;
  position: sticky; top: 0; z-index: 50;
}
.header-brand {
  display: flex; align-items: center; gap: 10px;
  padding-right: 24px; border-right: 1px solid rgba(255,255,255,.14);
  flex-shrink: 0; cursor: pointer;
}
.logo {
  width: 28px; height: 28px; background: #fff; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: var(--green-deep);
  font-family: 'Jost', sans-serif; letter-spacing: -.03em; flex-shrink: 0;
}
.brand-name { font-size: 17px; font-weight: 900; color: #fff; letter-spacing: -.03em; }
.brand-name span { color: #86efac; }
.nav { display: flex; align-items: stretch; gap: 2px; flex: 1; }
.nav-item {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 0 15px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.62); font-family: 'Jost', sans-serif;
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; transition: .15s;
  text-decoration: none; white-space: nowrap;
}
.nav-item:hover { color: rgba(255,255,255,.88); }
.nav-item.active { color: #fff; font-weight: 700; border-bottom-color: #86efac; background: rgba(255,255,255,.07); }
.nav-item svg { flex-shrink: 0; opacity: .7; }
.nav-item.active svg { opacity: 1; }
.header-right { display: flex; align-items: center; padding-left: 6px; margin-left: auto; flex-shrink: 0; }
.header-biz { font-size: 13px; color: rgba(255,255,255,.65); font-weight: 500; white-space: nowrap; padding-right: 16px; border-right: 1px solid rgba(255,255,255,.14); margin-right: 4px; }
.header-biz strong { color: #fff; }
.hdr-logout { font-size: 12px; font-family: 'Jost', sans-serif; color: rgba(255,255,255,.6); background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 5px 12px; cursor: pointer; transition: .15s; }
.hdr-logout:hover { color: #fff; border-color: rgba(255,255,255,.5); }

/* ── PAGE ── */
.page { max-width: 1080px; margin: 0; padding: 28px 40px 60px 152px; }
.page-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.page-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--green); margin-bottom: 4px; }
.page-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -.03em; line-height: 1.1; }
.btn-new-loc { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: 'Jost', sans-serif; background: var(--green); color: #fff; border: none; border-radius: 9px; cursor: pointer; transition: .15s; white-space: nowrap; flex-shrink: 0; }
.btn-new-loc:hover { background: var(--green-mid); }

/* ── TABLE ── */
.table-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(20,83,45,.06); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 12px 18px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: #FAFAF8; border-bottom: 1px solid var(--border-l); text-align: left; white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border-l); transition: background .12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #FAFAF8; }
tbody td { padding: 14px 18px; font-size: 13px; color: var(--text); vertical-align: middle; }
.td-name { font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; }
.td-code { font-family: monospace; font-size: 11px; background: var(--surface); border: 1px solid var(--border); padding: 2px 7px; border-radius: 5px; color: var(--muted); display: inline-block; }
.td-muted { color: var(--muted); }
.td-actions { white-space: nowrap; }
.act-sm { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; font-size: 12px; font-weight: 600; font-family: 'Jost', sans-serif; border: 1.5px solid var(--border); border-radius: 7px; background: #fff; color: var(--text); cursor: pointer; transition: .12s; margin-right: 6px; text-decoration: none; }
.act-sm:hover { border-color: var(--green); background: var(--green-l); color: var(--green-mid); }
.act-sm svg { opacity: .6; flex-shrink: 0; }
.act-sm:hover svg { opacity: 1; }

/* ── LOADING / EMPTY ── */
.loading { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; padding: 60px 0; justify-content: center; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-wrap { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-wrap svg { opacity: .25; margin-bottom: 16px; }
.empty-wrap h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-wrap p { font-size: 13px; }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,83,45,.28); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 16px; max-width: 460px; width: 100%; overflow: hidden; box-shadow: 0 20px 60px rgba(20,83,45,.18); }
.modal-header { padding: 22px 24px 18px; border-bottom: 1px solid var(--border-l); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.modal-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.modal-close { font-size: 16px; color: var(--muted); background: none; border: none; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
.modal-close:hover { background: var(--surface); color: var(--text); }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.form-input { padding: 10px 13px; font-size: 13px; font-family: 'Jost', sans-serif; border: 1.5px solid var(--border); border-radius: 9px; color: var(--text); background: #fff; transition: .15s; width: 100%; }
.form-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.1); }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-l); display: flex; justify-content: flex-end; gap: 10px; }
.btn-ghost { padding: 9px 18px; font-size: 13px; font-weight: 600; font-family: 'Jost', sans-serif; color: var(--muted); background: none; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: .15s; }
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.btn-primary { padding: 9px 20px; font-size: 13px; font-weight: 700; font-family: 'Jost', sans-serif; color: #fff; background: var(--green); border: none; border-radius: 8px; cursor: pointer; transition: .15s; }
.btn-primary:hover { background: var(--green-mid); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.form-alert { display: none; padding: 10px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 4px; }
.form-alert.show { display: block; }
.form-alert.error   { background: #fee2e2; color: #b91c1c; }
.form-alert.success { background: var(--green-b); color: var(--green-deep); }
.autocomplete-wrap { position: relative; }
.ac-list { display: none; position: absolute; top: calc(100% + 3px); left: 0; right: 0; background: #fff; border: 1.5px solid var(--border); border-radius: 8px; z-index: 400; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 16px rgba(20,83,45,.12); }
.ac-list.open { display: block; }
.ac-item { padding: 9px 12px; font-size: 13px; cursor: pointer; color: var(--text); }
.ac-item:hover { background: var(--green-l); color: var(--green-mid); }
.ac-empty { padding: 9px 12px; font-size: 13px; color: var(--muted-l); }

/* ── FOOTER ── */
.footer { text-align: center; padding: 24px 20px; font-size: 12px; color: var(--muted-l); }

@media (max-width: 720px) {
  .page { padding: 20px 16px 48px; }
  thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
}
</style>
</head>

<header class="header">
  <div class="header-brand" onclick="window.location.href=document.getElementById('nav-dashboard').href">
    <div class="logo">D</div>
    <span class="brand-name">dicho<span>.</span></span>
  </div>
  <nav class="nav">
    <a id="nav-dashboard" class="nav-item" href="#" target="_top">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a id="nav-qr" class="nav-item" href="#" target="_top">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="17" y="17" width="4" height="4" rx=".5"/><rect x="17" y="13" width="4" height="2" rx=".5"/><rect x="13" y="17" width="2" height="4" rx=".5"/></svg>

      <span>Ubicaciones</span>
    </a>
    <a id="nav-config" class="nav-item" href="#" target="_top">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Configuración</span>

  <div class="header-right">
    <span class="header-biz"><strong id="header-biz-name"></strong></span>

</header>

<div class="page">
  <div class="page-top">
    <div>

      <div class="page-title">Ubicaciones</div>

    <button class="btn-new-loc" onclick="openNewLocModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Crear nueva ubicación

<!-- Modal nueva ubicación -->
<div class="modal-overlay" id="new-loc-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-title">Nueva ubicación</div>
        <div class="modal-sub">Se generará un código QR único para esta sede.</div>
      </div>
      <button class="modal-close" onclick="closeNewLocModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-alert" id="new-loc-alert"></div>
      <div class="form-group">
        <label class="form-label" for="new-loc-nombre">NOMBRE DE LA UBICACIÓN</label>
        <input class="form-input" id="new-loc-nombre" type="text" placeholder="Ej. Sucursal Centro">
      </div>
      <div class="form-group">
        <label class="form-label" for="new-loc-ciudad">CIUDAD</label>
        <div class="autocomplete-wrap" id="new-loc-ciudad-wrap">
          <input class="form-input" id="new-loc-ciudad" type="text" autocomplete="off" placeholder="Ej. Ciudad de México">
          <div class="ac-list" id="new-loc-ciudad-list"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeNewLocModal()">Cancelar</button>
      <button class="btn-primary" id="new-loc-save" onclick="saveNewLocation()">Crear ubicación</button>
    </div>
  </div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwEgnKWZYNMFUclYoY3k9ujIMzF2nvL_TXq5cDoJ3cyOEKJwWLfEjjoqbcFVcV9DEvB1w/exec';
var TOKEN   = new URLSearchParams(window.location.search).get('token') || '';

function gasCall(page, params) {
  return new Promise(function(resolve, reject) {
    var cb = 'gc_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var url = GAS_URL + '?page=' + encodeURIComponent(page) + '&callback=' + cb;
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
        url += '&' + k + '=' + encodeURIComponent(params[k]);
      }
    }
    window[cb] = function(data) {
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
      resolve(data);
    };
    var s = document.createElement('script');
    s.src = url;
    s.onerror = function() {
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error('JSONP failed'));
    };
    document.head.appendChild(s);
  });
}

function esc(v) {
  return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function doLogout() {
  window.location.href = 'https://dichosea.com/login.html';
}

setTimeout(function() { document.body.style.visibility = 'visible'; }, 300);

(function init() {
  document.getElementById('nav-dashboard').href = 'https://dichosea.com/dashboard.html?token=' + encodeURIComponent(TOKEN);
  document.getElementById('nav-qr').href        = 'https://dichosea.com/codigoqr.html?token=' + encodeURIComponent(TOKEN);
  document.getElementById('nav-config').href    = 'https://dichosea.com/configuracion.html?token=' + encodeURIComponent(TOKEN);

  try {
    var b = sessionStorage.getItem('dicho_biz_' + TOKEN);
    if (b) document.getElementById('header-biz-name').textContent = b;
    var l = sessionStorage.getItem('dicho_lang_' + TOKEN);
    if (l) document.documentElement.lang = l;
  } catch(e) {}

  document.body.style.visibility = 'visible';

  if (!TOKEN) { showError('Token no encontrado. Accede desde tu panel de Dicho.'); return; }

  gasCall('api_qr', { token: TOKEN })
    .then(function(data) {
      if (!data || !data.ok) { showError((data && data.error) || 'Token inválido.'); return; }
      var biz = data.negocio || '';
      document.getElementById('header-biz-name').textContent = biz;
      if (biz) try { sessionStorage.setItem('dicho_biz_' + TOKEN, biz); } catch(e) {}
      if (data.idioma) try { sessionStorage.setItem('dicho_lang_' + TOKEN, data.idioma); } catch(e) {}
      renderTable(data.ubicaciones || []);
    })
    .catch(function(err) { showError('Error de conexión: ' + err); });
})();

function showError(msg) {
  document.getElementById('main-container').innerHTML =
    '<div class="empty-wrap"><h3>Error</h3><p>' + esc(msg) + '</p></div>';
}

function renderTable(locs) {
  var el = document.getElementById('main-container');
  if (!locs.length) {
    el.innerHTML =
      '<div class="empty-wrap">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
        '<h3>Sin ubicaciones todavía</h3><p>Crea tu primera ubicación para comenzar.</p>' +
      '</div>';
    return;
  }
  var rows = locs.map(function(loc) {
    var fecha = (loc.fecha_alta || '').split('T')[0] || '—';
    var qrLink = 'https://dichosea.com/codigoqr.html?token=' + encodeURIComponent(TOKEN);
    return (
      '<tr>' +
        '<td class="td-name">' + esc(loc.nombre_ubicacion || loc.nombre || '—') + '</td>' +
        '<td class="td-muted">' + esc(loc.ciudad || '—') + '</td>' +
        '<td><span class="td-code">' + esc(loc.codigo || loc.id || '—') + '</span></td>' +
        '<td class="td-muted">' + esc(fecha) + '</td>' +
        '<td class="td-actions">' +
          '<a class="act-sm" href="' + esc(qrLink) + '" target="_top">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>' +
            'Ver QR' +
          '</a>' +
        '</td>' +
      '</tr>'
    );
  }).join('');

  el.innerHTML =
    '<div class="table-card"><div class="table-wrap">' +
      '<table><thead><tr>' +
        '<th>Nombre</th><th>Ciudad</th><th>Código</th><th>Alta</th><th>Acciones</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '</div></div>';
}

/* Modal */
var CIUDADES = ['Ciudad de México','Guadalajara','Monterrey','Puebla','Tijuana','León','Juárez','Zapopan','Mérida','Chihuahua','San Luis Potosí','Aguascalientes','Hermosillo','Cancún','Saltillo','Querétaro','Morelia','Culiacán','Acapulco','Villahermosa'];

function openNewLocModal() {
  document.getElementById('new-loc-nombre').value = '';
  document.getElementById('new-loc-ciudad').value = '';
  var al = document.getElementById('new-loc-alert');
  al.className = 'form-alert'; al.textContent = '';
  document.getElementById('new-loc-save').disabled = false;
  document.getElementById('new-loc-save').textContent = 'Crear ubicación';
  document.getElementById('new-loc-modal').classList.add('open');
  setTimeout(function() { document.getElementById('new-loc-nombre').focus(); }, 50);
}
function closeNewLocModal() {
  document.getElementById('new-loc-modal').classList.remove('open');
  document.getElementById('new-loc-ciudad-list').classList.remove('open');
}

document.getElementById('new-loc-ciudad').addEventListener('input', function() {
  var v = this.value.trim().toLowerCase();
  var list = document.getElementById('new-loc-ciudad-list');
  if (!v) { list.classList.remove('open'); return; }
  var matches = CIUDADES.filter(function(c) { return c.toLowerCase().indexOf(v) === 0; }).slice(0, 5);
  list.innerHTML = matches.length
    ? matches.map(function(c) { return '<div class="ac-item" onclick="pickCity(\'' + c.replace(/'/g,"\\'") + '\')">' + esc(c) + '</div>'; }).join('')
    : '<div class="ac-empty">Sin sugerencias</div>';
  list.classList.add('open');
});
function pickCity(c) {
  document.getElementById('new-loc-ciudad').value = c;
  document.getElementById('new-loc-ciudad-list').classList.remove('open');
}
document.addEventListener('click', function(e) {
  if (!document.getElementById('new-loc-ciudad-wrap').contains(e.target))
    document.getElementById('new-loc-ciudad-list').classList.remove('open');
});

function saveNewLocation() {
  var nombre = document.getElementById('new-loc-nombre').value.trim();
  var ciudad = document.getElementById('new-loc-ciudad').value.trim();
  var al  = document.getElementById('new-loc-alert');
  var btn = document.getElementById('new-loc-save');
  if (!nombre) {
    al.className = 'form-alert error show';
    al.textContent = 'El nombre de la ubicación es obligatorio.';
    return;
  }
  btn.disabled = true; btn.textContent = 'Creando…';
  gasCall('api_add_location', { token: TOKEN, nombre_ubicacion: nombre, ciudad: ciudad })
    .then(function(data) {
      if (!data || !data.ok) {
        al.className = 'form-alert error show';
        al.textContent = (data && data.error) || 'Error al crear la ubicación.';
        btn.disabled = false; btn.textContent = 'Crear ubicación';
        return;
      }
      closeNewLocModal();
      document.getElementById('main-container').innerHTML = '<div class="loading"><div class="spinner"></div> Cargando…</div>';
      gasCall('api_qr', { token: TOKEN }).then(function(d) {
        if (d && d.ok) renderTable(d.ubicaciones || []);
      });
    })
    .catch(function() {
      al.className = 'form-alert error show';
      al.textContent = 'Error de conexión.';
      btn.disabled = false; btn.textContent = 'Crear ubicación';
    });
}
</script>
</body>
</html>
