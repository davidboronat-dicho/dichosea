<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root {
  --green-deep: #14532D;
  --green:      #16A34A;
  --green-mid:  #15803d;
  --green-l:    #F0FDF4;
  --surface:    #F5F1E8;
  --card:       #FFFFFF;
  --border:     #D8D2C3;
  --border-l:   #E8E4DA;
  --text:       #1C2B20;
  --muted:      #6B7A6E;
  --muted-l:    #9AAA9E;
  --danger:     #DC2626;
  --danger-l:   #FEE2E2;
  font-family: 'Jost', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--surface); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ── HEADER ── */
.header {
  background: var(--green-deep); height: 54px;
  display: flex; align-items: stretch; padding: 0 28px;
  position: sticky; top: 0; z-index: 50;
}
.header-brand { display: flex; align-items: center; gap: 10px; padding-right: 24px; border-right: 1px solid rgba(255,255,255,.14); flex-shrink: 0; }
.logo { width: 28px; height: 28px; background: #fff; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--green-deep); font-family: 'Plus Jakarta Sans', sans-serif; }
.brand-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 900; color: #fff; letter-spacing: -.03em; }
.brand-name span { color: #86efac; }
.nav { display: flex; align-items: stretch; gap: 2px; padding-left: 4px; flex: 1; }
.nav-item { display: inline-flex; align-items: center; gap: 7px; padding: 0 15px; font-size: 13px; font-weight: 500; font-family: 'Jost', sans-serif; color: rgba(255,255,255,.62); border: none; background: none; border-bottom: 2px solid transparent; text-decoration: none; transition: .15s; }
.nav-item:hover { color: rgba(255,255,255,.88); }
.nav-item.active { color: #fff; font-weight: 700; border-bottom-color: #86efac; background: rgba(255,255,255,.07); }
.header-right { display: flex; align-items: center; gap: 10px; padding-left: 6px; margin-left: auto; }
.header-biz { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.75); font-family: 'Jost', sans-serif; white-space: nowrap; padding-right: 16px; border-right: 1px solid rgba(255,255,255,.14); margin-right: 4px; }
.hdr-logout { font-size: 12px; font-family: 'Jost', sans-serif; color: rgba(255,255,255,.6); background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 5px 12px; cursor: pointer; transition: .15s; }
.hdr-logout:hover { color: #fff; border-color: rgba(255,255,255,.5); }

/* ── PAGE ── */
.page { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
.page-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.page-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: -.02em; line-height: 1.15; }

/* ── ADD BUTTON ── */
.btn-add { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; font-size: 13px; font-weight: 700; font-family: 'Jost', sans-serif; color: #fff; background: var(--green); border: none; border-radius: 8px; cursor: pointer; transition: .15s; white-space: nowrap; }
.btn-add:hover { background: var(--green-mid); }

/* ── MODULE CARDS ── */
#modules-container { display: flex; flex-direction: column; gap: 16px; }
.module-card { background: var(--card); border: 1px solid var(--border-l); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(20,83,45,.05); }
.module-card-head { padding: 18px 20px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.module-info { flex: 1; min-width: 0; }
.module-name-row { display: flex; align-items: center; gap: 8px; }
.module-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
.module-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.module-meta { display: flex; align-items: center; gap: 12px; margin-top: 5px; flex-wrap: wrap; }
.module-meta-item { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.module-meta-item strong { font-weight: 700; color: var(--text); text-transform: uppercase; font-size: 10px; letter-spacing: .05em; }
.module-meta-ok { color: var(--green-mid); font-weight: 600; }
.module-stats { padding: 12px 20px; border-top: 1px solid var(--border-l); border-bottom: 1px solid var(--border-l); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.stat + .stat { border-left: 1px solid var(--border-l); }
.stat-lbl { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-l); margin-bottom: 2px; }
.stat-val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 900; color: var(--text); line-height: 1; }
.stat-val.green { color: var(--green-mid); }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.stat-stars { color: #F59E0B; font-size: 12px; margin-top: 1px; }
.stat-chip { display: inline-block; background: var(--green-l); color: var(--green-deep); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.module-actions { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.action-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 12px; font-size: 12px; font-weight: 600; font-family: 'Jost', sans-serif; border-radius: 8px; text-decoration: none; cursor: pointer; transition: .15s; border: 1.5px solid var(--border); color: var(--muted); background: none; white-space: nowrap; }
.action-btn:hover { border-color: var(--green); color: var(--green-mid); }
.action-btn.primary { background: var(--green-l); border-color: var(--green); color: var(--green-deep); font-weight: 700; }

/* ── EMPTY ── */
.empty { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* ── MODAL ── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(20,83,45,.18); overflow: hidden; }
.modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border-l); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 800; color: var(--text); }
.modal-close { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: .15s; font-size: 18px; }
.modal-close:hover { background: var(--surface); color: var(--text); }
.modal-body { padding: 22px 24px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--border-l); display: flex; justify-content: flex-end; gap: 10px; }

/* ── FORM ── */
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
.form-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.form-input { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: 'Jost', sans-serif; color: var(--text); background: #fff; transition: .15s; width: 100%; }
.form-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.1); }
.form-hint { font-size: 11px; color: var(--muted-l); line-height: 1.5; }

/* ── BUTTONS ── */
.btn-ghost { padding: 9px 18px; font-size: 13px; font-weight: 600; font-family: 'Jost', sans-serif; color: var(--muted); background: none; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: .15s; }
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.btn-primary { padding: 9px 20px; font-size: 13px; font-weight: 700; font-family: 'Jost', sans-serif; color: #fff; background: var(--green); border: none; border-radius: 8px; cursor: pointer; transition: .15s; }
.btn-primary:hover { background: var(--green-mid); }
.btn-primary:disabled { opacity: .55; cursor: default; }

/* Save chip */
.save-chip { font-size: 12px; font-weight: 600; color: var(--green-mid); background: var(--green-l); padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; }
.save-chip.visible { opacity: 1; }

/* Spinner */
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; vertical-align: middle; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Plan limit banner */
.plan-banner { background: var(--green-l); border: 1px solid var(--green-b); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.plan-banner-text { flex: 1; font-size: 13px; color: var(--green-deep); line-height: 1.5; }
.plan-banner-text strong { font-weight: 700; }

@media (max-width: 560px) {
  #modules-container { grid-template-columns: 1fr; }
  .nav-item { padding: 0 10px; font-size: 12px; }
}
</style>

// ── GitHub Pages: leer params de URL + gasCall helper ────────────
var GAS_URL    = 'https://script.google.com/macros/s/AKfycbwEgnKWZYNMFUclYoY3k9ujIMzF2nvL_TXq5cDoJ3cyOEKJwWLfEjjoqbcFVcV9DEvB1w/exec';
var _p         = new URLSearchParams(window.location.search);
var TOKEN      = _p.get('token')   || '';
var SESSION    = _p.get('session') || '';
var SCRIPT_URL = GAS_URL;
var UB_DATA    = { ok: false, ubicaciones: [], feedbacks: [] };

function gasCall(page, params) {
  return new Promise(function(resolve, reject) {
    var cb = 'gc_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var url = GAS_URL + '?page=' + encodeURIComponent(page) + '&callback=' + cb;
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
        url += '&' + k + '=' + encodeURIComponent(params[k]);
      }
    }
    window[cb] = function(data) {
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
      resolve(data);
    };
    var s = document.createElement('script');
    s.src = url;
    s.onerror = function() {
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error('JSONP failed'));
    };
    document.head.appendChild(s);
  });
}

var LANG = 'es';

function applyLang(lang) {
  LANG = lang;
  document.body.style.visibility = 'visible';
  var tr = TR[lang] || TR['es'];
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (tr[key] !== undefined) el.textContent = tr[key];
  });
  document.documentElement.lang = lang === 'en' ? 'en' : lang === 'ca' ? 'ca' : 'es';
  try { sessionStorage.setItem('dicho_lang_' + TOKEN, lang); } catch(e) {}
}

// Aplicar idioma cacheado inmediatamente (evita flash)
try {
  var _cachedLang = sessionStorage.getItem('dicho_lang_' + TOKEN);
  if (_cachedLang && TR[_cachedLang]) applyLang(_cachedLang);
} catch(e) {}
// Fallback: si no hay caché, mostrar igual en 300ms para no bloquear
setTimeout(function() { document.body.style.visibility = 'visible'; }, 300);

// ── BUILD MODULE CARD ────────────────────────────────────────────
function buildModule(loc) {
  var tr    = TR[LANG] || TR['es'];
  var stats = loc.stats || {};
  var total      = stats.total    || 0;
  var avg        = stats.avgScore || 0;
  var pctPos     = stats.pctPos   || 0;
  var topTopic   = stats.topTopic || '';
  var topCount   = stats.topCount || 0;
  var dashUrl = 'https://dichosea.com/dashboard.html?token=' + encodeURIComponent(TOKEN) + '&loc=' + encodeURIComponent(loc.id || '');
  var qrUrl   = 'https://dichosea.com/codigoqr.html?token='  + encodeURIComponent(TOKEN);

  // Stars
  var starFull = Math.round(avg);
  var starsHtml = '';
  for (var s = 1; s <= 5; s++) starsHtml += (s <= starFull ? '★' : '☆');

  // Sentiment color
  var sentClass = pctPos >= 70 ? ' green' : '';

  return '<div class="module-card" id="card-' + escHtml(loc.id || '') + '">'

    // ── Head
    + '<div class="module-card-head">'
    +   '<div class="module-info">'
    +     '<div class="module-name-row">'
    +       '<div class="module-name">' + escHtml(loc.nombre || '') + '</div>'
    +       '<div class="module-dot"></div>'
    +     '</div>'
    +     '<div class="module-meta">'
    +       (loc.ciudad ? '<span class="module-meta-item"><strong>' + tr.lbl_ciudad + '</strong>' + escHtml(loc.ciudad) + '</span>' : '')
    +       (loc.codigo ? '<span class="module-meta-item"><strong>' + tr.lbl_codi + '</strong>' + escHtml(loc.codigo) + '</span>' : '')
    +       '<span class="module-meta-item"><strong>' + tr.lbl_ressenyes + '</strong>'
    +         (loc.reviewUrl ? '<span class="module-meta-ok">' + tr.lbl_configurat + '</span>' : tr.lbl_no_config)
    +       '</span>'
    +     '</div>'
    +   '</div>'
    + '</div>'

    // ── Stats
    + '<div class="module-stats">'
    +   '<div class="stat">'
    +     '<div class="stat-lbl">' + tr.lbl_feedbacks + '</div>'
    +     '<div class="stat-val">' + total + '</div>'
    +     '<div class="stat-sub">' + tr.lbl_rebuts + '</div>'
    +   '</div>'
    +   '<div class="stat">'
    +     '<div class="stat-lbl">' + tr.lbl_valoracio + '</div>'
    +     '<div class="stat-val">' + (total > 0 ? avg : '—') + '</div>'
    +     (total > 0 ? '<div class="stat-stars">' + starsHtml + '</div><div class="stat-sub">' + tr.lbl_de5 + '</div>' : '<div class="stat-sub">—</div>')
    +   '</div>'
    +   '<div class="stat">'
    +     '<div class="stat-lbl">' + tr.lbl_sentiment + '</div>'
    +     '<div class="stat-val' + sentClass + '">' + (total > 0 ? pctPos + '%' : '—') + '</div>'
    +     '<div class="stat-sub">' + tr.lbl_positiu + '</div>'
    +   '</div>'
    +   '<div class="stat">'
    +     '<div class="stat-lbl">' + tr.lbl_tema + '</div>'
    +     (topTopic ? '<div class="stat-chip">' + escHtml(topTopic) + '</div><div class="stat-sub">' + tr.lbl_mencionat + ' ' + topCount + ' ' + tr.lbl_vegades + '</div>' : '<div class="stat-val">—</div>')
    +   '</div>'
    + '</div>'

    // ── Actions
    + '<div class="module-actions">'
    +   '<a class="action-btn primary" href="' + dashUrl + '" target="_top">'
    +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'
    +     tr.btn_feedbacks
    +   '</a>'
    +   '<button class="action-btn" onclick="openEditModal(\'' + escHtml(loc.id || '') + '\')">'
    +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
    +     tr.btn_edit_info
    +   '</button>'
    +   '<a class="action-btn" href="' + qrUrl + '&print=1" target="_top">'
    +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>'
    +     tr.btn_print
    +   '</a>'
    +   '<a class="action-btn" href="' + qrUrl + '" target="_top">'
    +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>'
    +     tr.btn_qr
    +   '</a>'
    + '</div>'
    + '</div>';
}

function renderModules() {
  var locs = UB_DATA.ubicaciones || [];
  var container = document.getElementById('modules-container');
  if (!locs.length) {
    var tr = TR[LANG] || TR['es'];
    container.innerHTML = '<div class="empty"><h3>' + tr.empty_title + '</h3><p>' + tr.empty_text + '</p></div>';
    return;
  }
  container.innerHTML = locs.map(buildModule).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ─────────────────────────────────────────────────────────
(function init() {
  document.getElementById('nav-dashboard').href = 'https://dichosea.com/dashboard.html?token='   + encodeURIComponent(TOKEN);
  document.getElementById('nav-qr').href        = 'https://dichosea.com/codigoqr.html?token='    + encodeURIComponent(TOKEN);
  document.getElementById('nav-config').href    = 'https://dichosea.com/configuracion.html?token='+ encodeURIComponent(TOKEN);

  // Pre-populate business name from sessionStorage while API loads
  try {
    var _cachedBiz = sessionStorage.getItem('dicho_biz_' + TOKEN);
    if (_cachedBiz) document.getElementById('header-biz-name').textContent = _cachedBiz;
  } catch(e) {}

  gasCall('api_ubicaciones', { token: TOKEN })
    .then(function(data) {
      if (!data.ok) {
        window.location.href = 'https://dichosea.com/login.html';
        return;
      }
      UB_DATA = data;
      if (data.negocio) {
        document.getElementById('header-biz-name').textContent = data.negocio;
        try { sessionStorage.setItem('dicho_biz_' + TOKEN, data.negocio); } catch(e) {}
      }
      applyLang((data && data.idioma) || 'es');

      // Plan limit banner
      var plan      = data.plan || 'sin_costo';
      var locs      = data.ubicaciones || [];
      var maxLocs   = plan === 'enterprise' ? Infinity : plan === 'profesional' ? 5 : 1;
      var atLimit   = locs.length >= maxLocs;
      var bannerEl  = document.getElementById('plan-banner');
      if (atLimit && plan !== 'enterprise') {
        document.getElementById('plan-banner-text').innerHTML = TR[LANG].plan_limit || TR['es'].plan_limit;
        bannerEl.style.display = 'flex';
        document.getElementById('btn-add-loc').disabled = true;
        document.getElementById('btn-add-loc').style.opacity = '.5';
        document.getElementById('btn-add-loc').style.cursor = 'default';
      }

      renderModules();
    })
    .catch(function(err) {
      document.getElementById('modules-container').innerHTML =
        '<div class="empty"><h3>Error de conexión</h3><p>' + escHtml(String(err)) + '</p></div>';
    });
})();

// ── MODAL HELPERS ────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openEditModal(locId) {
  var locs = UB_DATA.ubicaciones || [];
  var loc  = null;
  for (var i = 0; i < locs.length; i++) { if (locs[i].id === locId) { loc = locs[i]; break; } }
  if (!loc) return;
  document.getElementById('edit-loc-id').value      = loc.id;
  document.getElementById('edit-nombre').value      = loc.nombre    || '';
  document.getElementById('edit-ciudad').value      = loc.ciudad    || '';
  document.getElementById('edit-review-url').value  = loc.reviewUrl || '';
  document.getElementById('chip-edit').classList.remove('visible');
  openModal('modal-edit');
}

function openNewModal() {
  document.getElementById('new-nombre').value = '';
  document.getElementById('new-ciudad').value = '';
  document.getElementById('chip-new').classList.remove('visible');
  openModal('modal-new');
}

// ── SAVE EDIT LOCATION ───────────────────────────────────────────
function saveEditLocation() {
  var btn = document.getElementById('btn-save-edit');
  var sp  = document.getElementById('edit-spinner');
  var lbl = document.getElementById('edit-label');
  btn.disabled = true; sp.style.display = 'inline-block'; lbl.style.display = 'none';

  var locId     = document.getElementById('edit-loc-id').value;
  var nombre    = document.getElementById('edit-nombre').value.trim();
  var ciudad    = document.getElementById('edit-ciudad').value.trim();
  var reviewUrl = document.getElementById('edit-review-url').value.trim();

  gasCall('api_updateLocation', { token: TOKEN, locId: locId, nombre: nombre, ciudad: ciudad, reviewUrl: reviewUrl })
    .then(function(res) {
      btn.disabled = false; sp.style.display = 'none'; lbl.style.display = '';
      if (res && res.ok) {
        // Update local cache
        var locs = UB_DATA.ubicaciones || [];
        for (var i = 0; i < locs.length; i++) {
          if (locs[i].id === locId) {
            locs[i].nombre    = nombre;
            locs[i].ciudad    = ciudad;
            locs[i].reviewUrl = reviewUrl;
            break;
          }
        }
        renderModules();
        showChip('chip-edit');
        setTimeout(function() { closeModal('modal-edit'); }, 900);
      }
    })
    .catch(function() { btn.disabled = false; sp.style.display = 'none'; lbl.style.display = ''; });
}

// ── SAVE NEW LOCATION ────────────────────────────────────────────
function saveNewLocation() {
  var btn = document.getElementById('btn-save-new');
  var sp  = document.getElementById('new-spinner');
  var lbl = document.getElementById('new-label');
  btn.disabled = true; sp.style.display = 'inline-block'; lbl.style.display = 'none';

  var nombre = document.getElementById('new-nombre').value.trim();
  var ciudad = document.getElementById('new-ciudad').value.trim();

  if (!nombre) {
    btn.disabled = false; sp.style.display = 'none'; lbl.style.display = '';
    document.getElementById('new-nombre').focus();
    return;
  }

  gasCall('api_addLocation', { token: TOKEN, nombre: nombre, ciudad: ciudad })
    .then(function(res) {
      btn.disabled = false; sp.style.display = 'none'; lbl.style.display = '';
      if (res && res.ok) {
        // Reload data to get updated list with new location id
        gasCall('api_ubicaciones', { token: TOKEN }).then(function(data) {
          if (data.ok) {
            UB_DATA = data;
            renderModules();
          }
        });
        showChip('chip-new');
        setTimeout(function() { closeModal('modal-new'); }, 900);
      }
    })
    .catch(function() { btn.disabled = false; sp.style.display = 'none'; lbl.style.display = ''; });
}

// ── HELPERS ──────────────────────────────────────────────────────
function showChip(id) {
  var chip = document.getElementById(id);
  chip.classList.add('visible');
  setTimeout(function() { chip.classList.remove('visible'); }, 2500);
}
function doLogout() {
  gasCall('api_logout', { session: SESSION }).catch(function() {});
  window.location.href = 'https://dichosea.com/login.html';
}
