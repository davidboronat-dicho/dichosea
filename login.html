<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicho · Acceder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F0F7F3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 32px rgba(22, 163, 74, 0.10);
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      color: #16A34A;
      letter-spacing: -1px;
      margin-bottom: 28px;
      text-align: center;
    }
    .logo span { color: #A7F3D0; }

    h2 {
      font-size: 20px;
      font-weight: 800;
      color: #1C2B20;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6B7A6E;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #D1D5DB;
      border-radius: 10px;
      font-size: 15px;
      color: #1C2B20;
      background: #fff;
      transition: border-color .15s;
      margin-bottom: 18px;
      outline: none;
    }
    input:focus { border-color: #16A34A; }

    .btn {
      width: 100%;
      padding: 13px;
      background: #16A34A;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .55; cursor: default; }

    .error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }

    .success {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #15803D;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .success.show { display: block; }

    .link-btn {
      background: none;
      border: none;
      color: #16A34A;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .link-btn:hover { opacity: .75; }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6B7A6E;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .negocio-badge {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #15803D;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">dicho<span>.</span></div>

  <!-- ── PANTALLA: cargando ── -->
  <div id="screen-loading" class="screen active">
    <div style="text-align:center;color:#6B7A6E;padding:20px 0">
      <span class="spinner" style="border-top-color:#16A34A;border-color:rgba(22,163,74,.3);"></span>
      Verificando acceso…
    </div>
  </div>

  <!-- ── PANTALLA: crear contraseña (primer acceso con token) ── -->
  <div id="screen-setpass" class="screen">
    <h2 id="setpass-title">¡Bienvenido!</h2>
    <p class="subtitle" id="setpass-subtitle">Crea tu contraseña para acceder a tu panel de Dicho.</p>
    <div id="setpass-badge" class="negocio-badge" style="display:none"></div>
    <div id="setpass-error" class="error"></div>
    <label for="setpass-pwd1">Nueva contraseña</label>
    <input id="setpass-pwd1" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    <label for="setpass-pwd2">Confirmar contraseña</label>
    <input id="setpass-pwd2" type="password" placeholder="Repite la contraseña" autocomplete="new-password">
    <button class="btn" id="setpass-btn" onclick="doSetPassword()">Crear contraseña y entrar</button>
  </div>

  <!-- ── PANTALLA: login con token (ya tiene contraseña) ── -->
  <div id="screen-login" class="screen">
    <h2>Acceder</h2>
    <p class="subtitle">Introduce tu contraseña para continuar.</p>
    <div id="login-badge" class="negocio-badge" style="display:none"></div>
    <div id="login-error" class="error"></div>
    <label for="login-pwd">Contraseña</label>
    <input id="login-pwd" type="password" placeholder="Tu contraseña" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLoginToken()">
    <button class="btn" id="login-btn" onclick="doLoginToken()">Entrar</button>
    <div class="footer-links" style="margin-top:14px">
      <button class="link-btn" onclick="showForgot()">¿Olvidaste tu contraseña?</button>
    </div>
  </div>

  <!-- ── PANTALLA: login general (email + contraseña) ── -->
  <div id="screen-general" class="screen">
    <h2>Acceder</h2>
    <p class="subtitle">Introduce tu email y contraseña.</p>
    <div id="general-error" class="error"></div>
    <label for="general-email">Email</label>
    <input id="general-email" type="email" placeholder="tu@email.com" autocomplete="email">
    <label for="general-pwd">Contraseña</label>
    <input id="general-pwd" type="password" placeholder="Tu contraseña" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLoginGeneral()">
    <button class="btn" id="general-btn" onclick="doLoginGeneral()">Entrar</button>
    <div class="footer-links">
      <button class="link-btn" onclick="showForgot()">¿Olvidaste tu contraseña?</button>
    </div>
  </div>

  <!-- ── PANTALLA: recuperar contraseña ── -->
  <div id="screen-forgot" class="screen">
    <h2>Recuperar contraseña</h2>
    <p class="subtitle">Te enviamos un enlace a tu correo para restablecer la contraseña.</p>
    <div id="forgot-error" class="error"></div>
    <div id="forgot-success" class="success"></div>
    <label for="forgot-email">Email</label>
    <input id="forgot-email" type="email" placeholder="tu@email.com" autocomplete="email"
           onkeydown="if(event.key==='Enter')doForgot()">
    <button class="btn" id="forgot-btn" onclick="doForgot()">Enviar enlace</button>
    <div class="footer-links">
      <button class="link-btn" onclick="showScreen('screen-general')">← Volver</button>
    </div>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwEgnKWZYNMFUclYoY3k9ujIMzF2nvL_TXq5cDoJ3cyOEKJwWLfEjjoqbcFVcV9DEvB1w/exec';
  var DASHBOARD_URL = 'https://dichosea.com/dashboard.html';

  // ── Leer params de la URL ──────────────────────────────────────────────────
  var _p     = new URLSearchParams(window.location.search);
  var TOKEN  = _p.get('token') || '';
  var LANG   = _p.get('lang')  || 'es';

  // ── Helpers ────────────────────────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  function showError(id, msg) {
    var el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideError(id) { document.getElementById(id).classList.remove('show'); }

  function setLoading(btnId, loading) {
    var btn = document.getElementById(btnId);
    if (loading) {
      btn.disabled = true;
      btn.dataset.orig = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>Espera…';
    } else {
      btn.disabled = false;
      btn.textContent = btn.dataset.orig || btn.textContent;
    }
  }

  function gasCall(page, params) {
    return new Promise(function(resolve, reject) {
      var cb = 'gc_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var url = GAS_URL + '?page=' + encodeURIComponent(page) + '&callback=' + cb;
      for (var k in params) {
        if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
          url += '&' + k + '=' + encodeURIComponent(params[k]);
        }
      }
      window[cb] = function(data) {
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
        resolve(data);
      };
      var s = document.createElement('script');
      s.src = url;
      s.onerror = function() {
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
        reject(new Error('JSONP failed'));
      };
      document.head.appendChild(s);
    });
  }

  function onLoginSuccess(sessionToken, clientToken) {
    var tok = clientToken || TOKEN;
    window.location.href = DASHBOARD_URL + '?token=' + encodeURIComponent(tok) + '&session=' + encodeURIComponent(sessionToken);
  }

  // ── Init: comprobar si hay token ───────────────────────────────────────────
  (function init() {
    if (!TOKEN) {
      showScreen('screen-general');
      return;
    }
    gasCall('checkPasswordSet', { token: TOKEN })
      .then(function(data) {
        if (!data.found) {
          showError('general-error', 'Enlace inválido o expirado. Usa tu email y contraseña.');
          showScreen('screen-general');
          return;
        }
        if (data.negocio) {
          var badge = document.getElementById(data.hasPassword ? 'login-badge' : 'setpass-badge');
          badge.textContent = '🏪 ' + data.negocio;
          badge.style.display = 'block';
        }
        if (data.hasPassword) {
          showScreen('screen-login');
        } else {
          showScreen('screen-setpass');
        }
      })
      .catch(function() {
        showError('general-error', 'Error de conexión. Inténtalo de nuevo.');
        showScreen('screen-general');
      });
  })();

  // ── Crear contraseña ───────────────────────────────────────────────────────
  function doSetPassword() {
    hideError('setpass-error');
    var p1 = document.getElementById('setpass-pwd1').value.trim();
    var p2 = document.getElementById('setpass-pwd2').value.trim();
    if (!p1 || p1.length < 6) { showError('setpass-error', 'La contraseña debe tener al menos 6 caracteres.'); return; }
    if (p1 !== p2)             { showError('setpass-error', 'Las contraseñas no coinciden.'); return; }
    setLoading('setpass-btn', true);
    gasCall('setPassword', { token: TOKEN, password: p1 })
      .then(function(data) {
        setLoading('setpass-btn', false);
        if (data.ok) {
          onLoginSuccess(data.sessionToken, data.token);
        } else {
          showError('setpass-error', data.error || 'Error al crear la contraseña.');
        }
      })
      .catch(function() {
        setLoading('setpass-btn', false);
        showError('setpass-error', 'Error de conexión. Inténtalo de nuevo.');
      });
  }

  // ── Login con token ────────────────────────────────────────────────────────
  function doLoginToken() {
    hideError('login-error');
    var pwd = document.getElementById('login-pwd').value;
    if (!pwd) { showError('login-error', 'Introduce tu contraseña.'); return; }
    setLoading('login-btn', true);
    gasCall('loginWithPassword', { token: TOKEN, password: pwd })
      .then(function(data) {
        setLoading('login-btn', false);
        if (data.ok) {
          onLoginSuccess(data.sessionToken, data.token);
        } else {
          showError('login-error', data.error || 'Contraseña incorrecta.');
        }
      })
      .catch(function() {
        setLoading('login-btn', false);
        showError('login-error', 'Error de conexión. Inténtalo de nuevo.');
      });
  }

  // ── Login general (email + pass) ───────────────────────────────────────────
  function doLoginGeneral() {
    hideError('general-error');
    var email = document.getElementById('general-email').value.trim();
    var pwd   = document.getElementById('general-pwd').value;
    if (!email) { showError('general-error', 'Introduce tu email.'); return; }
    if (!pwd)   { showError('general-error', 'Introduce tu contraseña.'); return; }
    setLoading('general-btn', true);
    gasCall('loginWithEmail', { email: email, password: pwd })
      .then(function(data) {
        setLoading('general-btn', false);
        if (data.ok) {
          onLoginSuccess(data.sessionToken, data.token);
        } else {
          showError('general-error', data.error || 'Email o contraseña incorrectos.');
        }
      })
      .catch(function() {
        setLoading('general-btn', false);
        showError('general-error', 'Error de conexión. Inténtalo de nuevo.');
      });
  }

  // ── Recuperar contraseña ───────────────────────────────────────────────────
  function showForgot() {
    var email = document.getElementById('general-email');
    if (email && email.value) {
      document.getElementById('forgot-email').value = email.value;
    }
    hideError('forgot-error');
    document.getElementById('forgot-success').classList.remove('show');
    showScreen('screen-forgot');
  }

  function doForgot() {
    hideError('forgot-error');
    document.getElementById('forgot-success').classList.remove('show');
    var email = document.getElementById('forgot-email').value.trim();
    if (!email) { showError('forgot-error', 'Introduce tu email.'); return; }
    setLoading('forgot-btn', true);
    gasCall('sendPasswordReset', { email: email })
      .then(function(data) {
        setLoading('forgot-btn', false);
        if (data.ok) {
          var s = document.getElementById('forgot-success');
          s.textContent = 'Enlace enviado a ' + email + '. Revisa tu bandeja de entrada.';
          s.classList.add('show');
        } else {
          showError('forgot-error', data.error || 'No encontramos una cuenta con ese correo.');
        }
      })
      .catch(function() {
        setLoading('forgot-btn', false);
        showError('forgot-error', 'Error de conexión. Inténtalo de nuevo.');
      });
  }
</script>
</body>
</html>
