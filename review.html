<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Revisa tu reseña · Dicho</title>
  <meta property="og:title" content="Revisa tu reseña antes de publicarla 🌟">
  <meta property="og:description" content="Gracias por tomarte un momento.">
  <meta property="og:site_name" content="Dicho">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"></noscript>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F0F7F3;
      color: #1a2e25;
    }

    /* ── Loading ── */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      color: #6a9a80;
      font-size: 15px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #C8E6D8;
      border-top-color: #2DB67D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .error-icon { font-size: 40px; }
    .error-msg { font-size: 16px; color: #6a9a80; }

    /* ── Page ── */
    .page {
      display: none;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      flex-direction: column;
    }

    /* ── Topbar ── */
    .topbar {
      padding: 48px 28px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .biz-name {
      font-family: 'Nunito', sans-serif;
      font-size: 20px; font-weight: 800;
      color: #1a2e25;
    }
    .biz-city {
      font-size: 15px;
      color: #6a9a80;
      margin-top: 4px;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 36px 0;
      text-align: center;
    }

    /* Check visual */
    .check-wrap {
      position: relative;
      width: 120px; height: 120px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
    }
    .check-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid #2DB67D;
      opacity: 0;
      animation: ripple 2.4s ease-out infinite;
    }
    .check-ring:nth-child(1) { width: 120px; height: 120px; animation-delay: 0s; }
    .check-ring:nth-child(2) { width: 92px;  height: 92px;  animation-delay: 0.6s; }
    .check-ring:nth-child(3) { width: 68px;  height: 68px;  animation-delay: 1.2s; }
    @keyframes ripple {
      0%   { opacity: 0.5; transform: scale(0.7); }
      100% { opacity: 0;   transform: scale(1.1); }
    }
    .check-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #2DB67D;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(45,182,125,0.35);
      position: relative;
      z-index: 1;
    }

    /* Headline */
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 28px; font-weight: 700;
      color: #1a2e25;
      line-height: 1.3;
      text-align: center;
      margin-bottom: 6px;
    }
    .headline-sub {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 700;
      color: #1a2e25;
      line-height: 1.3;
      text-align: center;
    }
    .headline-sub em {
      font-style: italic;
      color: #2DB67D;
    }

    /* ── Review area ── */
    .review-area {
      flex: 1;
      padding: 28px 28px 48px;
      display: flex;
      flex-direction: column;
    }

    .review-box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1.5px solid #ddeae0;
      min-height: 140px;
      font-size: 16px;
      line-height: 1.65;
      color: #333;
      outline: none;
      word-break: break-word;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .review-box:focus {
      border-color: #2DB67D;
      box-shadow: 0 0 0 3px rgba(45,182,125,0.12);
    }

    /* ── CTA ── */
    .cta-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .cta {
      background: linear-gradient(135deg, #1a7a52, #2DB67D);
      border: none;
      border-radius: 16px;
      padding: 18px 28px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(45,182,125,0.32);
      transition: opacity 0.15s, transform 0.15s;
      text-decoration: none;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    .cta:active { opacity: 0.88; transform: scale(0.985); }

    .cta-main {
      font-family: 'Nunito', sans-serif;
      font-size: 16px; font-weight: 900;
      color: white; line-height: 1.3;
      text-align: center;
    }

    .cta-hint {
      font-size: 13px;
      line-height: 1.5;
      color: #9ab8a8;
      text-align: center;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 36px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a2e25;
      color: white;
      padding: 13px 22px;
      border-radius: 13px;
      font-size: 14px; font-weight: 600;
      opacity: 0;
      transition: transform 0.35s ease, opacity 0.35s ease;
      white-space: nowrap;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px; color: #bbb;
    }
    .footer a { color: #2DB67D; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Loading -->
  <div class="loading-wrap" id="loading">
    <div class="spinner"></div>
    <span id="loadingText"></span>
  </div>

  <!-- Error -->
  <div class="error-wrap" id="error">
    <div class="error-icon">😕</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Page -->
  <div class="page" id="page">

    <div class="topbar">
      <div class="biz-name" id="negocio"></div>
      <div class="biz-city" id="ciudad"></div>
    </div>

    <div class="hero">
      <div class="check-wrap">
        <div class="check-ring"></div>
        <div class="check-ring"></div>
        <div class="check-ring"></div>
        <div class="check-circle">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="white"
               stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="30 10 15 26 8 19"/>
          </svg>
        </div>
      </div>

      <div class="headline" id="headline"></div>
      <div class="headline-sub" id="headlineSub"></div>
    </div>

    <div class="review-area">
      <div class="review-box" id="reviewText" contenteditable="true"></div>

      <div class="cta-section">
        <a class="cta" id="ctaBtn" href="#" target="_blank" rel="noopener" onclick="copyAndToast()">
          <div class="cta-main" id="ctaMain"></div>
        </a>
        <div class="cta-hint" id="ctaHint"></div>
      </div>

      <div class="footer">Powered by <a href="https://dichosea.com" target="_blank">Dicho</a></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbwEgnKWZYNMFUclYoY3k9ujIMzF2nvL_TXq5cDoJ3cyOEKJwWLfEjjoqbcFVcV9DEvB1w/exec';
    var CACHE_TTL = 30 * 60 * 1000; // 30 minutos

    // ── Traducciones ──
    var TR = {
      'es': {
        loading:     'Preparando tu reseña…',
        error:       'Esta reseña ya no está disponible.',
        headline:    'Revisa tu reseña',
        headlineSub: 'antes de <em>publicarla</em> 🌟',
        ctaMain:     'Copiar reseña y abrir Maps',
        ctaHint:     'En Google Maps solo deberás puntuar con<br>estrellas y pegar tu reseña.',
        toast:       '✅ Copiada. Puntúa con estrellas y pégala en Maps'
      },
      'es-mx': {
        loading:     'Preparando tu reseña…',
        error:       'Esta reseña ya no está disponible.',
        headline:    'Revisa tu reseña',
        headlineSub: 'antes de <em>publicarla</em> 🌟',
        ctaMain:     'Copiar reseña y abrir Maps',
        ctaHint:     'En Google Maps solo tienes que calificar con<br>estrellas y pegar tu reseña.',
        toast:       '✅ Copiada. Califica con estrellas y pégala en Maps'
      },
      'ca': {
        loading:     'Preparant la teva ressenya…',
        error:       'Aquesta ressenya ja no està disponible.',
        headline:    'Revisa la teva ressenya',
        headlineSub: 'abans de <em>publicar-la</em> 🌟',
        ctaMain:     'Copiar ressenya i obrir Maps',
        ctaHint:     'A Google Maps només cal que puntuis amb<br>estrelles i enganxis la teva ressenya.',
        toast:       '✅ Copiada. Puntua amb estrelles i enganxa-la a Maps'
      },
      'en': {
        loading:     'Preparing your review…',
        error:       'This review is no longer available.',
        headline:    'Check your review',
        headlineSub: 'before <em>publishing</em> it 🌟',
        ctaMain:     'Copy review & open Maps',
        ctaHint:     'On Google Maps just rate with stars<br>and paste your review.',
        toast:       '✅ Copied! Rate with stars and paste it on Maps'
      }
    };

    // ── Detectar idioma inicial por browser (mejora UX durante carga) ──
    function detectBrowserLang() {
      var params = new URLSearchParams(window.location.search);
      // Primero: param ?lang= en la URL
      var paramLang = params.get('lang');
      if (paramLang && TR[paramLang]) return paramLang;
      // Segundo: idioma del navegador
      var nav = navigator.language || navigator.userLanguage || 'es';
      if (nav.startsWith('ca')) return 'ca';
      if (nav.startsWith('en')) return 'en';
      return 'es';
    }

    function tr(lang, key) {
      var l = TR[lang] || TR['es'];
      return l[key] || TR['es'][key] || '';
    }

    function applyLang(lang) {
      document.getElementById('loadingText').textContent  = tr(lang, 'loading');
      document.getElementById('errorMsg').textContent     = tr(lang, 'error');
      document.getElementById('headline').textContent     = tr(lang, 'headline');
      document.getElementById('headlineSub').innerHTML    = tr(lang, 'headlineSub');
      document.getElementById('ctaMain').textContent      = tr(lang, 'ctaMain');
      document.getElementById('ctaHint').innerHTML        = tr(lang, 'ctaHint');
      document.getElementById('toast').textContent        = tr(lang, 'toast');
      document.documentElement.lang = lang === 'ca' ? 'ca' : (lang === 'en' ? 'en' : 'es');
    }

    // ── Caché localStorage ──
    function getCached(waId) {
      try {
        var raw = localStorage.getItem('review_' + waId);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        if (Date.now() - obj.ts > CACHE_TTL) { localStorage.removeItem('review_' + waId); return null; }
        return obj.data;
      } catch(e) { return null; }
    }

    function setCache(waId, data) {
      try { localStorage.setItem('review_' + waId, JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
    }

    // ── Ciudad: quitar ", País" si viene en el valor ──
    function formatCiudad(raw) {
      return (raw || '').split(',')[0].trim();
    }

    function show(id) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display   = 'none';
      document.getElementById('page').style.display    = 'none';
      if (id === 'loading') document.getElementById('loading').style.display = 'flex';
      if (id === 'error')   document.getElementById('error').style.display   = 'flex';
      if (id === 'page')    document.getElementById('page').style.display    = 'flex';
    }

    function renderData(data) {
      var lang = data.idioma_negocio || 'es';
      applyLang(lang);
      document.getElementById('negocio').textContent    = data.negocio       || '';
      document.getElementById('ciudad').textContent     = formatCiudad(data.ciudad);
      document.getElementById('reviewText').textContent = data.transcripcion || '';
      document.getElementById('ctaBtn').href             = data.reviewUrl     || '#';
      show('page');
    }

    // ── Iniciar ──
    var params = new URLSearchParams(window.location.search);
    var waId   = params.get('id');

    // Aplicar idioma inmediatamente para el texto de carga
    applyLang(detectBrowserLang());

    if (!waId) {
      show('error');
    } else {
      // Intentar caché primero
      var cached = getCached(waId);
      if (cached) {
        renderData(cached);
      } else {
        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var tid = controller ? setTimeout(function() { controller.abort(); }, 12000) : null;
        fetch(GAS_URL + '?page=reviewData&id=' + encodeURIComponent(waId), controller ? { signal: controller.signal } : {})
          .then(function(r) { if (tid) clearTimeout(tid); return r.json(); })
          .then(function(data) {
            if (!data.ok) { show('error'); return; }
            setCache(waId, data);
            renderData(data);
          })
          .catch(function() { show('error'); });
      }
    }

    function copyAndToast() {
      var text = document.getElementById('reviewText').innerText.trim();
      if (!text) return true;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
      } else {
        fallbackCopy(text);
      }
      showToast();
      return true;
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    }

    function showToast() {
      var el = document.getElementById('toast');
      el.classList.add('show');
      setTimeout(function() { el.classList.remove('show'); }, 4000);
    }
  </script>

</body>
</html>
