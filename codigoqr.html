<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --green-deep: #14532D;
  --green:      #16A34A;
  --green-mid:  #15803d;
  --green-l:    #F0FDF4;
  --green-b:    #D1FAE5;
  --surface:    #F5F1E8;
  --card:       #FFFFFF;
  --border:     #D8D2C3;
  --border-l:   #E8E4DA;
  --text:       #1C2B20;
  --muted:      #6B7A6E;
  --muted-l:    #9AAA9E;
  font-family: 'Jost', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--surface); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ── HEADER ── */
.header {
  background: var(--green-deep);
  height: 54px;
  display: flex;
  align-items: stretch;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-brand {
  display: flex; align-items: center; gap: 10px;
  padding-right: 24px;
  border-right: 1px solid rgba(255,255,255,.14);
  flex-shrink: 0;
}
.logo {
  width: 28px; height: 28px;
  background: #fff; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: var(--green-deep);
  font-family: 'Jost', sans-serif; letter-spacing: -.03em; flex-shrink: 0;
}
.brand-name { font-size: 17px; font-weight: 900; color: #fff; letter-spacing: -.03em; }
.brand-name span { color: #86efac; }
.nav { display: flex; align-items: stretch; gap: 2px; flex: 1; }
.nav-item {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 0 15px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.62); font-family: 'Jost', sans-serif;
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; transition: .15s;
  text-decoration: none; white-space: nowrap;
}
.nav-item:hover { color: rgba(255,255,255,.88); }
.nav-item.active {
  color: #fff; font-weight: 700;
  border-bottom-color: #86efac; background: rgba(255,255,255,.07);
}
.nav-item svg { flex-shrink: 0; opacity: .7; }
.nav-item.active svg { opacity: 1; }
.header-right {
  display: flex; align-items: center;
  padding-left: 6px;
  margin-left: auto; flex-shrink: 0;
}
.header-biz {
  font-size: 13px; color: rgba(255,255,255,.65); font-weight: 500;
  white-space: nowrap;
  padding-right: 16px; border-right: 1px solid rgba(255,255,255,.14); margin-right: 4px;
}
.header-biz strong { color: #fff; }

/* ── PAGE ── */
.page { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

.page-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 16px;
  margin-bottom: 28px; flex-wrap: wrap;
}
.page-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--green); margin-bottom: 4px;
}
.page-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 26px; font-weight: 800;
  color: var(--text); letter-spacing: -.03em; line-height: 1.1;
}
.btn-new-loc {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; font-size: 13px; font-weight: 700;
  font-family: 'Jost', sans-serif;
  background: var(--green); color: #fff;
  border: none; border-radius: 9px; cursor: pointer; transition: .15s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-new-loc:hover { background: var(--green-mid); }

/* ── LOADING / EMPTY ── */
.loading {
  display: flex; align-items: center; gap: 12px;
  color: var(--muted); font-size: 14px;
  padding: 60px 0; justify-content: center;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-wrap {
  text-align: center; padding: 80px 20px;
  color: var(--muted);
}
.empty-wrap svg { opacity: .25; margin-bottom: 16px; }
.empty-wrap h3 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px;
}
.empty-wrap p { font-size: 13px; }

/* ── LOC MODULE ── */
.loc-module {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(20,83,45,.06);
}
.loc-module-header {
  display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-l);
}
.loc-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px; font-weight: 800;
  color: var(--text); letter-spacing: -.02em;
}
.loc-meta {
  display: flex; align-items: center; gap: 10px;
  margin-top: 3px; flex-wrap: wrap;
}
.loc-meta-item { font-size: 12px; color: var(--muted); }
.loc-code {
  font-size: 11px; font-family: monospace;
  background: var(--surface); border: 1px solid var(--border);
  padding: 2px 7px; border-radius: 5px; color: var(--muted);
}
.loc-module-body {
  display: flex; align-items: flex-start; gap: 32px;
  padding: 28px 24px;
}

/* ── QR CARD ── */
.qr-card {
  background: #F0FDF4;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 6px 28px rgba(0,0,0,.10);
  border: 1px solid #D1FAE5;
  display: flex; flex-direction: row;
  max-width: 340px; flex-shrink: 0;
}
.card-left {
  flex: 1;
  padding: 18px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.card-right {
  width: 134px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 18px 23px 14px 8px;
  gap: 10px;
}
.cl-stars { color: #FACC15; font-size: 11px; letter-spacing: 1.5px; margin-bottom: 7px; }
.cl-headline {
  font-size: 18px; font-weight: 900; color: #1C2B20;
  line-height: 1.18; letter-spacing: -.02em; margin-bottom: 14px;
}
.cl-headline em { font-style: normal; color: #16A34A; display: block; }
.cl-scan-label {
  font-size: 9.5px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .14em; color: #16A34A; margin-bottom: 6px;
}
.cl-via-row {
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
}
.cl-via { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #9CA3AF; }
.cl-wa {
  background: #16A34A; color: #fff;
  font-size: 8px; font-weight: 800; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 20px;
}
.cl-footer { display: flex; align-items: center; padding-top: 10px; margin-top: 14px; }
.cr-top { display: flex; align-items: center; gap: 5px; }
.cr-via { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #9CA3AF; }
.cr-wa {
  background: #16A34A; color: #fff;
  font-size: 8px; font-weight: 800; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 20px;
}
.cr-qr { background: #fff; border-radius: 14px; padding: 9px; }
.cr-qr img, .cr-qr canvas { width: 110px; height: 110px; display: block; }
.cr-powered { font-size: 9px; font-weight: 600; color: #6B7A6E; }
.cr-powered strong { color: #1C2B20; font-weight: 800; }

/* ── ACTIONS COL ── */
.actions-col {
  display: flex; flex-direction: column; gap: 10px;
  padding-top: 4px;
}
.act-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; font-size: 13px; font-weight: 600;
  font-family: 'Jost', sans-serif;
  color: var(--text); background: #fff;
  border: 1.5px solid var(--border); border-radius: 9px;
  cursor: pointer; transition: .15s; white-space: nowrap;
  text-decoration: none;
}
.act-btn:hover {
  border-color: var(--green); background: var(--green-l); color: var(--green-mid);
}
.act-btn svg { flex-shrink: 0; opacity: .65; }
.act-btn:hover svg { opacity: 1; }
.act-btn.primary { color: var(--green); border-color: var(--green-b); background: var(--green-l); }
.act-btn.primary:hover { background: #d1fae5; border-color: var(--green); }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(20,83,45,.28); backdrop-filter: blur(4px);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #fff; border-radius: 16px;
  max-width: 460px; width: 100%;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(20,83,45,.18);
}
.modal-header {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border-l);
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.modal-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px; font-weight: 800;
  color: var(--text); letter-spacing: -.02em;
}
.modal-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.modal-close {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; line-height: 1; padding: 2px; flex-shrink: 0;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label {
  font-size: 12px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted);
}
.form-input {
  padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: 'Jost', sans-serif;
  color: var(--text); background: #fff;
  transition: .15s; width: 100%;
}
.form-input:focus {
  outline: none; border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(22,163,74,.1);
}
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border-l);
  display: flex; justify-content: flex-end; gap: 10px;
}
.btn-ghost {
  padding: 9px 18px; font-size: 13px; font-weight: 600;
  font-family: 'Jost', sans-serif; color: var(--muted);
  background: none; border: 1.5px solid var(--border);
  border-radius: 8px; cursor: pointer; transition: .15s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.btn-primary {
  padding: 9px 20px; font-size: 13px; font-weight: 700;
  font-family: 'Jost', sans-serif; color: #fff;
  background: var(--green); border: none;
  border-radius: 8px; cursor: pointer; transition: .15s;
}
.btn-primary:hover { background: var(--green-mid); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

.form-alert {
  display: none; padding: 10px 13px; border-radius: 8px;
  font-size: 13px; margin-bottom: 4px;
}
.form-alert.show { display: block; }
.form-alert.error   { background: #fee2e2; color: #b91c1c; }
.form-alert.success { background: var(--green-b); color: var(--green-deep); }

/* ── AUTOCOMPLETE ── */
.autocomplete-wrap { position: relative; }
.ac-list {
  display: none; position: absolute; top: calc(100% + 3px); left: 0; right: 0;
  background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
  z-index: 400; max-height: 200px; overflow-y: auto;
  box-shadow: 0 4px 16px rgba(20,83,45,.12);
}
.ac-list.open { display: block; }
.ac-item { padding: 9px 12px; font-size: 13px; cursor: pointer; color: var(--text); }
.ac-item:hover { background: var(--green-l); color: var(--green-mid); }
.ac-empty { padding: 9px 12px; font-size: 13px; color: var(--muted-l); }

/* ── FOOTER ── */
.footer {
  text-align: center; padding: 24px 20px;
  font-size: 12px; color: var(--muted-l);
}

@media (max-width: 720px) {
  .loc-module-body { flex-direction: column; gap: 20px; }
  .qr-card { min-width: unset; width: 100%; }
  .actions-col { flex-direction: row; flex-wrap: wrap; }
  .page { padding: 20px 16px 48px; }
}
@media (max-width: 480px) {
  .card-left { padding: 16px 14px; }
  .card-right { min-width: 120px; padding: 14px 10px; }
  .card-qr { width: 90px; height: 90px; }
}
</style>

// ── QR + micrófono ───────────────────────────────────────────
var QR_GREEN = '#14532D';
var QR_SIZE  = 220, QR_CX = 110, QR_CY = 110, QR_R = 38;

function rrPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,      y + h, x,      y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x,      y,     x + r,  y,         r);
  ctx.closePath();
}

function drawMic(ctx, centerX, centerY, totalHeight, color) {
  var s  = totalHeight / 118;
  var ox = centerX - 50 * s;
  var oy = centerY - 59 * s;
  ctx.save();
  ctx.fillStyle   = color;
  ctx.strokeStyle = color;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.lineWidth = 11 * s;
  ctx.beginPath();
  ctx.moveTo(ox + 19*s, oy + 40*s);
  ctx.bezierCurveTo(ox+19*s, oy+90*s, ox+81*s, oy+90*s, ox+81*s, oy+40*s);
  ctx.stroke();
  rrPath(ctx, ox + 45*s, oy + 90*s, 10*s, 14*s, 5*s); ctx.fill();
  rrPath(ctx, ox + 22*s, oy + 102*s, 56*s, 10*s, 5*s); ctx.fill();
  rrPath(ctx, ox + 34*s, oy + 4*s, 32*s, 55*s, 16*s); ctx.fill();
  ctx.restore();
}

function paintQROnCanvas(destCanvas, qrSrc) {
  var ctx = destCanvas.getContext('2d');
  ctx.drawImage(qrSrc, 0, 0, QR_SIZE, QR_SIZE);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(QR_CX, QR_CY, QR_R + 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = QR_GREEN;
  ctx.beginPath(); ctx.arc(QR_CX, QR_CY, QR_R, 0, Math.PI * 2); ctx.fill();
  var iconH = QR_R * 1.1;
  drawMic(ctx, QR_CX, QR_CY - iconH * 0.04, iconH, '#ffffff');
}

function renderQRForLoc(locId) {
  var canvas = document.getElementById('qr-canvas-' + locId);
  if (!canvas) return;
  var url = canvas.getAttribute('data-url');
  if (!url) return;
  var tmp = document.createElement('div');
  tmp.style.display = 'none';
  document.body.appendChild(tmp);
  new QRCode(tmp, {
    text: url, width: QR_SIZE, height: QR_SIZE,
    colorDark: QR_GREEN, colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  setTimeout(function() {
    var src = tmp.querySelector('canvas') || tmp.querySelector('img');
    if (!src) { document.body.removeChild(tmp); return; }
    if (src.tagName === 'CANVAS') {
      paintQROnCanvas(canvas, src);
      document.body.removeChild(tmp);
    } else {
      var img = new Image();
      img.onload = function() { paintQROnCanvas(canvas, img); document.body.removeChild(tmp); };
      img.src = src.src;
    }
  }, 250);
}

// ── saveAsImage ──────────────────────────────────────────────
function saveAsImage(locId) {
  var loc = null;
  var locs = (QR_DATA && QR_DATA.ubicaciones) || [];
  for (var i = 0; i < locs.length; i++) {
    if (locs[i].id === locId) { loc = locs[i]; break; }
  }
  if (!loc) return;

  var btn = document.getElementById('btn-img-' + locId);
  var origText = btn ? btn.querySelector('span').textContent : '';
  if (btn) btn.querySelector('span').textContent = t('generating');

  var qrCanvas = document.getElementById('qr-canvas-' + locId);
  if (!qrCanvas) { if (btn) btn.querySelector('span').textContent = origText; return; }

  var cw = 680, ch = 300;
  var canvas = document.createElement('canvas');
  canvas.width = cw * 2; canvas.height = ch * 2;
  var ctx = canvas.getContext('2d');
  ctx.scale(2, 2);

  var r = 20;
  var rightW = 148;
  var leftW = cw - rightW;

  // Card background
  roundRect(ctx, 0, 0, cw, ch, r, '#F0FDF4');
  ctx.strokeStyle = '#D1FAE5';
  ctx.lineWidth = 1.5;
  roundRectStroke(ctx, 0, 0, cw, ch, r);

  // card-left
  var lx = 20, ly = 20;

  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#FACC15';
  ctx.fillText('★★★★★', lx, ly + 13);
  ly += 24;

  ctx.font = '900 20px "Plus Jakarta Sans", sans-serif';
  ctx.fillStyle = '#1C2B20';
  ctx.fillText(t('cl_h1'), lx, ly + 20);
  ly += 26;

  ctx.fillText(t('cl_h2'), lx, ly + 20);
  ly += 26;

  ctx.fillStyle = '#16A34A';
  ctx.fillText(t('cl_hem'), lx, ly + 20);
  ly += 32;

  // Scan label
  ctx.font = '800 9px "Plus Jakarta Sans", sans-serif';
  ctx.fillStyle = '#16A34A';
  ctx.fillText(t('cl_scan_label').toUpperCase(), lx, ly + 10);
  ly += 18;

  // Via WHATSAPP pill
  ctx.font = '700 8px "Jost", sans-serif';
  ctx.fillStyle = '#9CA3AF';
  ctx.fillText(t('cr_via').toUpperCase(), lx, ly + 9);
  var pillX = lx + 22;
  var pillText = t('cr_wa');
  ctx.font = '800 8px "Jost", sans-serif';
  var pillW = ctx.measureText(pillText).width + 14;
  roundRect(ctx, pillX, ly, pillW, 16, 8, '#16A34A');
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(pillText, pillX + pillW / 2, ly + 11);
  ctx.textAlign = 'left';

  // card-right: QR con micrófono (tomado del canvas ya renderizado)
  var qboxPad = 9, qsize = 110;
  var qboxW = qsize + qboxPad * 2;
  var qboxH = qsize + qboxPad * 2;
  var qboxX = leftW + (rightW - qboxW) / 2;
  var qboxY = (ch - qboxH - 20) / 2;
  roundRect(ctx, qboxX, qboxY, qboxW, qboxH, 14, '#ffffff');
  ctx.drawImage(qrCanvas, qboxX + qboxPad, qboxY + qboxPad, qsize, qsize);

  // powered by
  ctx.font = '600 9px "Jost", sans-serif';
  ctx.fillStyle = '#6B7A6E';
  ctx.textAlign = 'center';
  ctx.fillText('powered by dicho.', leftW + rightW / 2, qboxY + qboxH + 14);
  ctx.textAlign = 'left';

  var nombre = (loc.nombre || 'qr').replace(/[^a-z0-9]/gi, '_').toLowerCase();
  var link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = 'dicho-qr-' + nombre + '.png';
  link.click();

  if (btn) btn.querySelector('span').textContent = origText;
}

function roundRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function roundRectStroke(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.stroke();
}

function saveNewLocation() {
  var nombre = document.getElementById('new-loc-nombre').value.trim();
  var ciudad = document.getElementById('new-loc-ciudad').value.trim();
  if (!nombre) {
    showAlert('new-loc-alert', t('err_nombre'), 'error');
    return;
  }
  var btn = document.getElementById('new-loc-save');
  btn.disabled = true;
  btn.textContent = t('creating');
  hideAlert('new-loc-alert');

  gasCall('api_addLocation', { token: TOKEN, nombre: nombre, ciudad: ciudad })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = t('btn_create');
      if (res && res.ok) {
        closeNewLocModal();
        var newLoc = res.ubicacion;
        if (QR_DATA && QR_DATA.ubicaciones) QR_DATA.ubicaciones.push(newLoc);
        var container = document.getElementById('modules-container');
        var empty = container.querySelector('.empty-wrap');
        if (empty) container.innerHTML = '';
        var div = document.createElement('div');
        div.innerHTML = buildModule(newLoc);
        container.appendChild(div.firstElementChild);
        var mod = document.getElementById('mod-' + newLoc.id);
        if (mod) mod.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        renderQRForLoc(newLoc.id);
      } else {
        showAlert('new-loc-alert', (res && res.error) || 'Error al crear la ubicación.', 'error');
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = t('btn_create');
      showAlert('new-loc-alert', 'Error: ' + (err.message || err), 'error');
    });
}

// ── Nominatim autocomplete ───────────────────────────────────
var _acInited = {};
function makeAutocomplete(inputId, listId, wrapId) {
  if (_acInited[inputId]) return;
  _acInited[inputId] = true;
  var input = document.getElementById(inputId);
  var list  = document.getElementById(listId);
  if (!input || !list) return;
  var _timer = null, _ctrl = null;

  input.addEventListener('input', function() {
    clearTimeout(_timer);
    var q = input.value.trim();
    list.classList.remove('open');
    if (q.length < 2) return;
    _timer = setTimeout(function() {
      if (_ctrl) _ctrl.abort();
      _ctrl = new AbortController();
      fetch(
        'https://nominatim.openstreetmap.org/search?format=json&q=' +
        encodeURIComponent(q) + '&limit=5&addressdetails=1',
        {
          signal: _ctrl.signal,
          headers: { 'Accept-Language': currentLang === 'ca' ? 'ca,es' : currentLang === 'en' ? 'en' : 'es' }
        }
      )
      .then(function(r) { return r.json(); })
      .then(function(results) {
        list.innerHTML = '';
        if (!results.length) {
          list.innerHTML = '<div class="ac-empty">Sin resultados</div>';
          list.classList.add('open');
          return;
        }
        results.forEach(function(r) {
          var city = (r.address && (r.address.city || r.address.town || r.address.village || r.address.county)) || r.display_name;
          var item = document.createElement('div');
          item.className = 'ac-item';
          item.textContent = r.display_name;
          item.addEventListener('mousedown', function(e) {
            e.preventDefault();
            input.value = city;
            list.classList.remove('open');
          });
          list.appendChild(item);
        });
        list.classList.add('open');
      })
      .catch(function() {});
    }, 300);
  });

  input.addEventListener('blur', function() {
    setTimeout(function() { list.classList.remove('open'); }, 150);
  });
}

// ── Helpers ──────────────────────────────────────────────────
function showAlert(id, msg, type) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'form-alert ' + type + ' show';
}
function hideAlert(id) {
  var el = document.getElementById(id);
  if (el) el.className = 'form-alert';
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
