<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicho · Feedback</title>
<script>
  // La página Código QR ya no existe: el QR está en Feedback → «Ver QR».
  // Redirigimos conservando el token para que los enlaces antiguos sigan funcionando.
  (function () {
    var p = new URLSearchParams(window.location.search);
    var q = new URLSearchParams();
    if (p.get('token'))   q.set('token', p.get('token'));
    if (p.get('session')) q.set('session', p.get('session'));
    q.set('qr', '1');
    window.location.replace('https://dichosea.com/ubicaciones.html?' + q.toString());
  })();
</script>
</head>
<body style="font-family:sans-serif;color:#6B7A6E;padding:40px;text-align:center">
  Redirigiendo… <a href="https://dichosea.com/ubicaciones.html">Ir a Feedback</a>
</body>
</html>
