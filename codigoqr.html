<script>

var GAS_URL = 'https://script.google.com/macros/s/AKfycbwEgnKWZYNMFUclYoY3k9ujIMzF2nvL_TXq5cDoJ3cyOEKJwWLfEjjoqbcFVcV9DEvB1w/exec';
// Ejemplo: 'https://script.google.com/macros/s/AKfycb.../exec'

(function() {
  var params = new URLSearchParams(window.location.search);
  var token  = params.get('token') || '';
  if (!token) {
    window.location.replace('https://dichosea.com/login.html');
    return;
  }
  var dest = GAS_URL + '?page=qr&token=' + encodeURIComponent(token);
  window.location.replace(dest);
})();
</script>
